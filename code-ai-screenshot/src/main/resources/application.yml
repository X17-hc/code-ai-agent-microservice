spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: code-ai-screenshot
server:
  port: 8127
  servlet:
    context-path: /api
# 添加 COS 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: ${COS_CUSTOM_DOMAIN_COM}
    secretId: ${COS_SECRET_ID}
    secretKey: ${COS_SECRET_KEY}
    region: ${COS_REGION}
    bucket: ${COS_BUCKET_NAME}

# Dubbo
dubbo:
  registry:
    address: nacos://127.0.0.1:8848?username=nacos&password=nacos
    register-mode: instance
  protocol:
    name: tri
    port: 50052
  consumer:
    timeout: 120000 # 截图服务比较耗时，设置为120s
  provider:
    timeout: 120000